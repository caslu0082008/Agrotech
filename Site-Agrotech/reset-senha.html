<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){try{if(localStorage.getItem("agrotech-theme")==="light"){document.documentElement.setAttribute("data-theme","light");}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha — AgroTech</title>
<meta name="description" content="Redefina a senha da sua conta AgroTech.">
<meta name="theme-color" content="#145c26">
<link rel="icon" type="image/svg+xml" href="img/agrotech-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/efeitos.css">
<style>
  .reset-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .reset-card {
    width: 100%; max-width: 400px; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--r-lg); padding: 34px 30px 30px; box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  [data-theme="light"] .reset-card { box-shadow: 0 20px 50px rgba(15,45,20,.14); }
  .reset-title {
    font-family: 'Bebas Neue', 'Oswald', 'Haettenschweiler', 'Arial Narrow', sans-serif;
    font-size: 34px; letter-spacing: .02em; color: var(--text1); margin-bottom: 6px;
  }
  .reset-sub { font-size: 14px; color: var(--text2); line-height: 1.6; margin-bottom: 24px; }
  .reset-back { display: block; margin-top: 18px; text-align: center; font-size: 14px; color: var(--green4); text-decoration: none; }
  [data-theme="light"] .reset-back { color: var(--accent); }
  .reset-back:hover { text-decoration: underline; }
</style>
<link rel="stylesheet" href="css/paisagem.css">
<link rel="stylesheet" href="css/acabamento.css">
</head>
<body>

<div class="reset-wrap">
  <div class="reset-card">
    <div class="reset-title">Nova senha</div>
    <p class="reset-sub" id="resetSub">Crie uma nova senha para acessar sua conta AgroTech.</p>

    <form id="resetForm" novalidate>
      <div class="field">
        <label for="resetPassword">Nova senha</label>
        <input type="password" id="resetPassword" name="password" placeholder="Mínimo 8 caracteres, com letras e números" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="resetPasswordConfirm">Confirmar nova senha</label>
        <input type="password" id="resetPasswordConfirm" name="passwordConfirm" placeholder="Repita a nova senha" autocomplete="new-password" required>
      </div>
      <button type="submit" class="submit-btn">
        <span class="btn-label">Redefinir senha</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>
      <div class="login-error" id="resetError"></div>
      <div class="form-success" id="resetSuccess"><span class="ico">✓</span><span class="form-success-text">Senha redefinida com sucesso!</span></div>
    </form>

    <a href="index.html" class="reset-back">Voltar para o site</a>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const form = document.getElementById('resetForm');
  const errorEl = document.getElementById('resetError');
  const successEl = document.getElementById('resetSuccess');
  const subEl = document.getElementById('resetSub');
  let submitting = false;

  if (!token) {
    subEl.textContent = 'Link de recuperação inválido: token não encontrado na URL.';
    form.style.display = 'none';
    return;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (submitting) return;

    errorEl.textContent = '';
    errorEl.classList.remove('show');
    successEl.style.display = 'none';

    const password = document.getElementById('resetPassword').value;
    const passwordConfirm = document.getElementById('resetPasswordConfirm').value;

    if (password.length < 8 || !/[A-Za-z]/.test(password) || !/\d/.test(password)) {
      errorEl.textContent = 'A senha deve ter pelo menos 8 caracteres, com letras e números.';
      errorEl.classList.add('show');
      return;
    }
    if (password !== passwordConfirm) {
      errorEl.textContent = 'As senhas não coincidem.';
      errorEl.classList.add('show');
      return;
    }

    const btn = form.querySelector('.submit-btn');
    submitting = true;
    btn.disabled = true;
    btn.classList.add('is-loading');

    try {
      await window.AgroAuth.apiRequest('/reset-password', { method: 'POST', body: { token, password } });
      successEl.style.display = 'flex';
      form.querySelectorAll('input, button').forEach(el => { el.hidden = true; });
    } catch (err) {
      errorEl.textContent = err.message || 'Não foi possível redefinir a senha. Tente novamente.';
      errorEl.classList.add('show');
    } finally {
      submitting = false;
      btn.disabled = false;
      btn.classList.remove('is-loading');
    }
  });
})();
</script>
<footer class="site-footer"><div class="footer-banner"><a class="footer-leaf" href="index.html" aria-label="AgroTech — página inicial"><img src="img/agrotech-logo.svg" width="84" height="84" alt=""></a><div class="footer-message"><h2>Precisa de mais materiais?</h2><a href="contato.html">Entre em contato com a equipe.</a></div><div class="footer-note"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M19 4H9v21h17V11ZM19 4v7h7M6 9H3v20h17M13 15h9m-9 5h9"/></svg><p>Novos materiais são adicionados conforme o projeto avança.</p></div></div></footer>
<script src="js/chuva.js"></script>
</body>
</html>
